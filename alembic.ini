# Alembic configuration for taskq-api.
# SPEC §6 mandates migrations/ lives at the project root with this
# `alembic.ini` pointing at it. The `alembic/env.py` imports the ORM
# declarative base from `taskq_api.models.orm` so revisions can autogen
# against the live schema (FR-07).

[alembic]
# Path to the migrations directory — revisions live under versions/.
# Resolved relative to this ``alembic.ini`` (project root) so alembic
# finds ``env.py`` + ``versions/`` at ``03-development/src/migrations/``.
# The SAB binds FR-07 to ``migrations.versions.v3_split_results`` (a
# Python import path that resolves to
# ``03-development/src/migrations/versions/v3_split_results.py``) so
# the migration chain MUST live at the src-tree path the import
# contract points at — splitting the chain across two roots would
# violate the Gate-1 phantom check.
script_location = 03-development/src/migrations

# Template used to generate new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Search path for `alembic ... --sql` literal SQL rendering.
sqlalchemy.url =

# Timezone for `create_date`/`update_date` columns.
timezone = UTC

# Max identifier length; PostgreSQL = 63, SQLite has no limit.
truncate_slug_length = 40

# Revision filename prefix.
revision_environment = false

# Set in env.py: `target_metadata = taskq_api.models.orm.Base.metadata`.
# `alembic revision --autogenerate` compares this against the live DB.

[post_write_hooks]
# Lint auto-generated revisions so style regressions cannot land.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S